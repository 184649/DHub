name: DHub preview validation
on:
  push:
    branches: [codex/dhub-reliability-launcher-20261017]
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Remove historical build outputs from checkout
        shell: pwsh
        run: |
          Get-ChildItem src -Directory -Recurse | Where-Object { $_.Name -in @('bin', 'obj') } | Sort-Object FullName -Descending | Remove-Item -Recurse -Force
      - name: Compile WPF application and updater
        run: dotnet build DHub.sln -c Release --no-incremental
      - name: Storage regression
        run: dotnet run --project tests/StorageRegression/StorageRegression.csproj -c Release
      - name: Launcher regression
        run: dotnet run --project tests/LauncherRegression/LauncherRegression.csproj -c Release
      - name: Updater regression
        run: dotnet run --project tests/UpdaterRegression/UpdaterRegression.csproj -c Release
