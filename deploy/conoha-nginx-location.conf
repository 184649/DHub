# ConoHa VPS / Nginx: existing dawn-app.jp server block に追加する場所の例。
# このファイルを自動適用しないこと。既存の /home を書き換えない。
# 既存の catch-all location / 等より明示的なルートとして動作。
# 既存の認証基盤に統合できる場合は auth_basic と重複利用しない。

location ^~ /home/office/ {
    alias /srv/aimanga-office/current/;
    index index.html;
    autoindex off;
    try_files $uri $uri/ =404;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 例: このパスへのアクセスを認証制限する場合、認証ファイルはGitHubへ保存しない。
    # auth_basic "AIMANGA Private";
    # auth_basic_user_file /etc/nginx/.aimanga-office-htpasswd;
}