# `dawn-app.jp` の**既存のHTTPS server { ... }内**にのみ追記する例
# 対象: https://dawn-app.jp/manga/   （/home に変更を加えない）
# 適用前に既存のNginx設定・配信ディレクトリ・認証方式を確認する。
# 配信用ファイル: /srv/aimanga-office/current/index.html と assets/ 等。
# この設定例をリポジトリ配置だけで本番へ自動適用しない。

location = /manga {
    return 308 /manga/;
}

location ^~ /manga/ {
    alias /srv/aimanga-office/current/;
    index index.html;
    autoindex off;

    # 該当VPS上に秘密の認証ファイルを作成してから有効にする。
    auth_basic "AIMANGA Private";
    auth_basic_user_file /etc/nginx/.aimanga-office-htpasswd;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# 認証を不要にする判断は、情報が公開可能であることをCEOが確認してから。
# 既存の /home/ や /api/ 等の location、証明書・DNS・server_nameは一切変更しない。
